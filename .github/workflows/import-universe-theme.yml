name: Import licensed universe background music
on:
  push:
    paths:
      - '.github/workflows/import-universe-theme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Download official Pixabay audio
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, html, pathlib, urllib.request
          page='https://pixabay.com/music/ambient-atmospheric-science-165602/'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36','Accept-Language':'en-US,en;q=0.9','Referer':'https://pixabay.com/'}
          req=urllib.request.Request(page,headers=headers)
          source=urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')
          matches=re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',source,re.I|re.S)
          mp3=[]
          for block in matches:
              try:
                  obj=json.loads(html.unescape(block))
                  values=obj if isinstance(obj,list) else [obj]
                  for item in values:
                      if isinstance(item,dict):
                          url=item.get('contentUrl')
                          if isinstance(url,str) and url.startswith('https:'): mp3.append(url)
              except Exception: pass
          if not mp3:
              for m in re.findall(r'https?:?\\?/\\?/cdn\.pixabay\.com[^"\s<>]+?\.mp3(?:\?[^"\s<>]*)?',source,re.I):
                  mp3.append(m.replace('\\/','/'))
          if not mp3:
              raise RuntimeError('Official music download URL could not be extracted')
          audio=urllib.request.urlopen(urllib.request.Request(mp3[0],headers=headers),timeout=90).read()
          if len(audio)<50000 or not (audio[:3]==b'ID3' or audio[0]==255):
              raise RuntimeError('Not an MP3 or too short')
          out=pathlib.Path('audio/universe-theme.mp3');out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(audio)
          print('Downloaded',len(audio),'bytes from Pixabay source',page)
          PY
      - name: Commit soundtrack to website
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add audio/universe-theme.mp3
          git diff --cached --quiet || (git commit -m "Add universe ambient soundtrack" && git push)
