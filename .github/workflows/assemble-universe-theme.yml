name: Assemble uploaded Universe soundtrack
on:
  push:
    paths:
      - '_audio_parts/**'
      - '.github/workflows/assemble-universe-theme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble and verify the user's original MP3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=sorted(Path('_audio_parts').glob('part_*.b64'))
          if len(parts)!=35: raise ValueError(f'Expected 35 audio pieces, got {len(parts)}')
          encoded=''.join(p.read_text().strip() for p in parts)
          audio=base64.b64decode(encoded,validate=True)
          expected='9a58b6752c170de94a036dbbab0b1f84bad0ac45ab4b6d592ee1460623977bef'
          if len(audio)!=6529358 or hashlib.sha256(audio).hexdigest()!=expected:
              raise ValueError('Original music file checksum mismatch. Not publishing damaged audio.')
          Path('audio').mkdir(exist_ok=True)
          Path('audio/universe-theme.mp3').write_bytes(audio)
          print(f'Verified original music: {len(audio)} bytes, SHA256 {expected}')
          PY
      - name: Publish MP3 and remove upload pieces
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add audio/universe-theme.mp3
          git rm -r _audio_parts
          git diff --cached --quiet || (git commit -m "Install verified Universe background theme MP3" && git push)
